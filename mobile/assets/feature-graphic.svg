<?xml version="1.0" encoding="UTF-8"?>
<!-- CiviTest feature graphic — 1024x500 (Google Play) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#012a5e"/>
      <stop offset="55%"  stop-color="#002654"/>
      <stop offset="100%" stop-color="#001d44"/>
    </linearGradient>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset dx="0" dy="8" result="off"/>
      <feFlood flood-color="#00102b" flood-opacity="0.45" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Decorative concentric tint circles behind the mark -->
  <circle cx="800" cy="240" r="300" fill="#ffffff" opacity="0.04"/>
  <circle cx="800" cy="240" r="200" fill="#ffffff" opacity="0.04"/>

  <!-- === BRANDING (left) === -->
  <!-- Title -->
  <text x="70" y="252"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="92"
        fill="#ffffff" letter-spacing="-1">CiviTest</text>

  <!-- Tagline -->
  <text x="74" y="306"
        font-family="Arial, sans-serif"
        font-size="25" fill="#ffffff" opacity="0.82" letter-spacing="0.3">Réussissez l’examen civique français.</text>

  <!-- Divider -->
  <line x1="74" y1="330" x2="300" y2="330" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>

  <!-- Pills -->
  <text x="74" y="360"
        font-family="Arial, sans-serif"
        font-size="16" fill="#9db8da" letter-spacing="1.4">GRATUIT  ·  HORS-LIGNE  ·  SANS PUB</text>

  <!-- === BRAND MARK (right) — white badge, navy check, bleu-blanc-rouge dots === -->
  <g transform="translate(482.56,-67.44) scale(0.62)" filter="url(#badgeShadow)">
    <rect x="300" y="286" width="424" height="452" rx="96" fill="#ffffff"/>
    <path d="M 398,518 L 476,596 L 628,420" fill="none" stroke="#002654" stroke-width="60"
      stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="442" cy="674" r="26" fill="#002654"/>
    <circle cx="512" cy="674" r="26" fill="#ffffff" stroke="#002654" stroke-width="6"/>
    <circle cx="582" cy="674" r="26" fill="#ce1126"/>
  </g>

  <!-- Bottom tricolor accent strip -->
  <rect x="0"      y="492" width="341.33" height="8" fill="#002654"/>
  <rect x="341.33" y="492" width="341.33" height="8" fill="#ffffff"/>
  <rect x="682.66" y="492" width="341.34" height="8" fill="#ce1126"/>
</svg>
